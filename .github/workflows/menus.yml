name: Gerar Cardápios

# Raspa os cardápios dos 5 campi direto no runner (sem Python/Render) e faz upsert
# na tabela `menus` do Supabase. Ao final, um único job commita os snapshots em
# data/*.json via deploy key SSH — o push com deploy key conta como atividade e
# impede o GitHub de desabilitar os workflows agendados (regra dos 60 dias).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1,3" # seg/qua 11:00 BRT (14:00 UTC)

concurrency:
  group: gerar-cardapios
  cancel-in-progress: false

jobs:
  scrape:
    name: Cardápio ${{ matrix.campus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a falha de um campus não bloqueia os demais
      matrix:
        campus: [florianopolis, joinville, ararangua, curitibanos, blumenau]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Gerar cardápio de ${{ matrix.campus }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: bun src/index.ts ${{ matrix.campus }}
      # Só publica o snapshot se o scrape passou (incluindo a validação de sanidade);
      # um artifact de job falho seria o snapshot ANTIGO do checkout, confundindo o debug.
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.campus }}
          path: data/${{ matrix.campus }}.json
          if-no-files-found: error

  commit:
    name: Commit dos snapshots (keep-alive)
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout via deploy key SSH: o push com ela conta como atividade e reinicia
      # o contador de 60 dias (o GITHUB_TOKEN NÃO conta).
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.MENU_COMMIT_SSH_KEY }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Consolidar snapshots
        run: |
          mkdir -p data
          for f in artifacts/snapshot-*/*.json; do
            [ -e "$f" ] && cp "$f" data/
          done
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last-run.txt
      - name: Commit e push
        run: |
          git config user.name "cardapios-ufsc-bot"
          git config user.email "cardapios-ufsc-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore: atualiza cardápios ($(date -u +%F))"
            # Retry com rebase: cobre corrida com um push humano entre checkout e push.
            for i in 1 2 3; do
              git push && break
              git pull --rebase && continue
            done
          fi
