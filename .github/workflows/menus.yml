name: Gerar Cardápios

# Raspa os cardápios dos 6 RUs (5 campi + RU do CCA) direto no runner (sem Python/Render) e faz upsert
# na tabela `menus` do Supabase. Ao final, um único job commita os snapshots em
# data/*.json via deploy key SSH — o push com deploy key conta como atividade e
# impede o GitHub de desabilitar os workflows agendados (regra dos 60 dias).

on:
  workflow_dispatch:
  schedule:
    - cron: "7 14 * * 1,3"  # seg/qua 11:07 BRT (14:07 UTC) — fora do minuto :00 p/ evitar drop de agendados
    - cron: "37 14 * * 1,3" # backup ~30min depois; o GitHub descarta agendados sob carga (sobretudo nas segundas). O job de commit é idempotente, então rodar 2x é inofensivo.

permissions:
  contents: read

concurrency:
  group: gerar-cardapios
  cancel-in-progress: false

jobs:
  scrape:
    name: Cardápio ${{ matrix.campus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a falha de um campus não bloqueia os demais
      matrix:
        campus: [florianopolis, cca, joinville, ararangua, curitibanos, blumenau]
    steps:
      # Sem deploy key e sem credencial persistida: este job roda dependências de terceiros
      # (bun install + scraper) e não pode ter como pushar nada.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Gerar cardápio de ${{ matrix.campus }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          CAMPUS: ${{ matrix.campus }}
        run: bun src/index.ts "$CAMPUS"
      # Só publica o snapshot se o scrape passou (incluindo a validação de sanidade);
      # um artifact de job falho seria o snapshot ANTIGO do checkout, confundindo o debug.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.campus }}
          path: data/${{ matrix.campus }}.json
          if-no-files-found: error
          overwrite: true # reruns (retry.yml) reenviam o mesmo nome

  commit:
    name: Commit dos snapshots (keep-alive)
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    # O push usa a deploy key (SSH), não o GITHUB_TOKEN → basta leitura.
    # Este job só roda comandos git: nada de bun install / código de terceiros aqui.
    steps:
      # Checkout via deploy key SSH: o push com ela conta como atividade e reinicia
      # o contador de 60 dias (o GITHUB_TOKEN NÃO conta). `ref: main` garante a ponta
      # da branch mesmo em RERUNS (o default seria o SHA do run original → detached
      # HEAD e push impossível).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.MENU_COMMIT_SSH_KEY }}
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Commit e push
        run: |
          git config user.name "cardapios-ufsc-bot"
          git config user.email "cardapios-ufsc-bot@users.noreply.github.com"
          # Estratégia à prova de corrida/rerun: a cada tentativa, realinha na ponta
          # da main e RECONSTRÓI o commit por cima (sem rebase → sem conflito possível).
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p data
            for f in artifacts/snapshot-*/*.json; do
              [ -e "$f" ] && cp "$f" data/
            done
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last-run.txt
            git add data/
            if git diff --cached --quiet; then
              echo "Nada para commitar."
              exit 0
            fi
            git commit -m "chore: atualiza cardápios ($(date -u +%F))"
            if git push origin main; then
              exit 0
            fi
            echo "Push falhou (corrida?); tentativa $i/3…"
          done
          echo "::error::Não foi possível pushar os snapshots."
          exit 1
