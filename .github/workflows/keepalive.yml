name: Keep-alive

# Rede de segurança para a regra dos 60 dias do GitHub (workflows agendados são
# desativados após 60 dias sem commit de usuário). Normalmente o "Gerar Cardápios"
# já commita 2x/semana e mantém o repo ativo; este workflow é um backstop caso as
# raspagens falhem por várias semanas seguidas.
#
# Usa um PAT (secrets.MENU_COMMIT_PAT) — commits do GITHUB_TOKEN NÃO contam.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # toda segunda 09:00 BRT (12:00 UTC)

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MENU_COMMIT_PAT }}
      - name: Heartbeat
        run: |
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt
          git config user.name "cardapios-ufsc-bot"
          git config user.email "cardapios-ufsc-bot@users.noreply.github.com"
          git add data/keepalive.txt
          git commit -m "chore: keep-alive $(date -u +%F)"
          git push
