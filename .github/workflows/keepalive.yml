name: Keep-alive

# Rede de segurança para a regra dos 60 dias do GitHub (workflows agendados são
# desativados após 60 dias sem commit de usuário). Normalmente o "Gerar Cardápios"
# já commita 2x/semana e mantém o repo ativo; este workflow é um backstop caso as
# raspagens falhem por várias semanas seguidas.
#
# Usa uma deploy key SSH (secrets.MENU_COMMIT_SSH_KEY) — commits do GITHUB_TOKEN NÃO contam.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 12 * * 1" # toda segunda 09:07 BRT (12:07 UTC) — fora do minuto :00 p/ evitar drop de agendados

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # O push usa a deploy key (SSH), não o GITHUB_TOKEN → o token só precisa de leitura.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.MENU_COMMIT_SSH_KEY }}
          ref: main
      - name: Heartbeat
        run: |
          git config user.name "cardapios-ufsc-bot"
          git config user.email "cardapios-ufsc-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p data
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/keepalive.txt
            git add data/keepalive.txt
            git commit -m "chore: keep-alive $(date -u +%F)"
            git push origin main && exit 0
            echo "Push falhou; tentativa $i/3…"
          done
          exit 1
